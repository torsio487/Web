<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadlock Wiki - Feedback</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container site-container pt-3">
        <nav class="navbar navbar-expand-lg mb-4 p-3" id="main-header">
            <div class="container-fluid p-0">
                <a class="header-logo" href="index.html">
                    <img src="https://deadlock.wiki/images/a/a5/Mina_card.png" alt="Deadlock Logo">
                    <span>Deadlock Wiki</span>
                </a>
                <button class="navbar-toggler custom-toggler bg-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse nav-menu" id="navbarNav">
                    <div class="navbar-nav ms-auto gap-3">
                        <a href="index.html">Home</a>
                        <a href="characters.html">Characters</a>
                        <a href="apollo.html">Apollo</a>
                        <a href="paradox.html">Paradox</a>
                        <a href="feedback.html">Feedback</a>
                    </div>
                </div>
            </div>
        </nav>

        <div class="row">
            <aside class="col-lg-3 col-md-4 mb-4">
                <div class="sidebar p-4">
                    <h3>Page Navigation</h3>
                    <ul>
                        <li><a href="#feedback-section">Feedback Form</a></li>
                        <li><a href="#about-us-section">About Developers</a></li>
                    </ul>
                    <hr style="border-color: #0f3460; margin: 20px 0;">
                    <h3>Contact Info</h3>
                    <p style="font-size: 0.85rem;">Golden Goose Egg Team</p>
                </div>
            </aside>

            <main class="col-lg-9 col-md-8">
                <section id="feedback-section" class="custom-panel p-4 mb-4">
                    <h2>Deadlock Wiki Feedback</h2>
                    <p>Help us improve our community wiki! Send us your thoughts.</p>
                    
                    <!-- Task 9: Responsive Form Design -->
                    <form id="feedback-form" action="#" method="POST" class="mt-4">
                        <div class="mb-3">
                            <label for="nickname" class="form-label">Your Nickname:</label>
                            <input type="text" class="form-control text-light" style="background-color: #2e4d1c; border-color: #444;" id="nickname" name="nickname" placeholder="Enter your nickname" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address:</label>
                            <input type="email" class="form-control text-light" style="background-color: #2e4d1c; border-color: #444;" id="email" name="email" placeholder="Enter your email address" required>
                        </div>

                        <div class="mb-3">
                            <label for="category" class="form-label">Feedback Category:</label>
                            <select class="form-select text-light" style="background-color: #2e4d1c; border-color: #444;" id="category" name="category">
                                <option value="content">Content Suggestion / Lore</option>
                                <option value="bug">Bug Report / Display Issue</option>
                                <option value="hero-guide">Hero Guide Submission</option>
                                <option value="other">General Feedback</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="message" class="form-label">Detailed Feedback:</label>
                            <textarea class="form-control text-light" style="background-color: #2e4d1c; border-color: #444;" id="message" name="message" rows="5" placeholder="Write your feedback here..." required></textarea>
                        </div>

                        <!-- Task 6: Button Group -->
                        <div class="mb-3">
                            <label class="form-label d-block">Did you find the Wiki helpful?</label>
                            <div class="btn-group" role="group">
                                <input type="radio" class="btn-check" name="btnradio" id="btnradio1" autocomplete="off" checked>
                                <label class="btn btn-outline-success" for="btnradio1">Yes</label>
                                <input type="radio" class="btn-check" name="btnradio" id="btnradio2" autocomplete="off">
                                <label class="btn btn-outline-danger" for="btnradio2">No</label>
                            </div>
                        </div>

                        <button type="submit" class="btn custom-btn btn-lg px-4 mt-2">Submit Feedback</button>
                    </form>
                </section>
            </main>
        </div>

        <footer class="p-4 mt-2 mb-4">
            <p class="mb-0">Created by Golden Goose Egg Team: Alizan Talov & Ruslan Suleimen</p>
        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
